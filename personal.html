<!DOCTYPE html>

    <style>
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", "Aptos", sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #34495e;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            min-height: 100vh;
        }

        a { text-decoration: none; color: #0F4761; transition: 0.3s; }
        a:hover { color: #e74c3c; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            color: #fff !important;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-home { background: linear-gradient(135deg, #5a6c7d 0%, #7a8fa3 100%); }

        header { text-align: center; margin-bottom: 60px; }
        .cover-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .sub-info { font-family: "KaiTi", "標楷體", serif; font-size: 1.2em; color: #555; margin-top: 20px; }

        section { margin-bottom: 60px; padding-top: 60px; margin-top: -40px; }

        h2.section-title {
            color: #0F4761;
            font-size: 1.8em;
            border-left: 6px solid #0F4761;
            padding: 10px 15px;
            margin-bottom: 30px;
            font-family: "KaiTi", serif;
            font-weight: bold;
            background: #f9f9f9;
        }

        p { font-size: 1.05em; text-align: justify; margin-bottom: 15px; }

        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">

    <nav class="nav-buttons">
        <a class="btn btn-home" href="index.html">首頁</a>
    </nav>

    <header>
        <img class="cover-image" src="groupbaogao_pic/cover.jpg" alt="美味牛丼封面">
        <div class="sub-info">
            <p>個人期末報告</p>
            <p>學生：1411322055 葉韋植</p>

    <footer>
