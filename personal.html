<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>美味牛丼 - 個人期末報告</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", "Aptos", sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #34495e;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            min-height: 100vh;
        }

        a { text-decoration: none; color: #0F4761; transition: 0.3s; }
        a:hover { color: #e74c3c; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            color: #fff !important;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-home { background: linear-gradient(135deg, #5a6c7d 0%, #7a8fa3 100%); }

        header { text-align: center; margin-bottom: 60px; }
        .cover-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .sub-info { font-family: "KaiTi", "標楷體", serif; font-size: 1.2em; color: #555; margin-top: 20px; }

        section { margin-bottom: 60px; padding-top: 60px; margin-top: -40px; }

        h2.section-title {
            color: #0F4761;
            font-size: 1.8em;
            border-left: 6px solid #0F4761;
            padding: 10px 15px;
            margin-bottom: 30px;
            font-family: "KaiTi", serif;
            font-weight: bold;
            background: #f9f9f9;
        }

        p { font-size: 1.05em; text-align: justify; margin-bottom: 15px; }

        .toc {
            background: #fdfdfd;
            border: 1px solid #ddd;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 60px;
        }
        .toc h2 { text-align: center; font-family: "KaiTi", serif; margin-top: 0; }
        .toc ul { list-style: none; padding: 0; }
        .toc li { border-bottom: 1px dashed #eee; padding: 8px 0; }
        .toc a { display: block; font-size: 1.2em; font-family: "KaiTi", serif; font-weight: bold; }

        .media-block {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .media-img {
            flex: 1 1 400px;
        }
        .media-img img {
            width: 100%;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .caption {
            font-family: "KaiTi", serif;
            color: #666;
            margin-top: 5px;
            font-size: 0.9em;
            text-align: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto 30px;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .canva-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 100%;
            padding-bottom: 0;
            margin: 0 auto 0.9em;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px 0 rgba(63, 69, 81, 0.16);
        }
        .canva-wrapper iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }
        .canva-attribution {
            text-align: center;
            font-size: 0.95em;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">

    <nav class="nav-buttons">
        <a class="btn btn-home" href="index.html">首頁</a>
    </nav>

    <header>
        <img class="cover-image" src="groupbaogao_pic/cover.jpg" alt="美味牛丼封面">
        <div class="sub-info">
            <p>個人期末報告</p>
            <p>學生：1411322055 葉韋植</p>
            <p>指導老師：陳賢錫老師</p>
        </div>
    </header>

    <div class="toc">
        <h2>目錄</h2>
        <ul>
            <li><a href="#section1">壹、個人貢獻報告書</a></li>
            <li><a href="#section2">貳、個人宣傳影片</a></li>
            <li><a href="#section3">參、個人展場設計</a></li>
        </ul>
    </div>

    <section id="section1">
        <h2 class="section-title">壹、個人貢獻報告書</h2>
        <div class="canva-wrapper">
            <iframe loading="lazy" src="https://www.canva.com/design/DAHHmstvEJM/hcbsoWWCMl27TtoMw8JQ6w/view?embed" allowfullscreen allow="fullscreen" title="美味牛丼 個人貢獻"></iframe>
        </div>
        <p class="canva-attribution">
            <a href="https://www.canva.com/design/DAHHmstvEJM/hcbsoWWCMl27TtoMw8JQ6w/view?utm_content=DAHHmstvEJM&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">美味牛丼 個人貢獻</a> by waiji yiap
        </p>
    </section>

    <section id="section2">
        <h2 class="section-title">貳、個人宣傳影片</h2>
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/8Y9VK6An9yo?si=QikNeIb0KAsr7X1Q" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>

    <section id="section3">
        <h2 class="section-title">參、個人展場設計</h2>
        <div class="media-block">
            <div class="media-img">
                <img src="personal_pic/poster.png" alt="個人展場設計">
                <div class="caption">個人展場設計</div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 美味牛丼製作團隊 | 指導老師：陳賢錫</p>
    </footer>

</div>

</body>
</html>
